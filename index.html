<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Areej Maryam — Full Stack Developer</title>

  <!-- Google Fonts — change this line to swap font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ======== NAVBAR ====================================== -->
  <nav class="navbar">
    <a href="#home" class="nav-logo">AM</a>

    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#projects">Projects</a></li> 
      <li><a href="#certificates">Certificates</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <div class="nav-right">
      <button class="theme-btn" id="theme-btn">
        <span class="icon">🌙</span> Dark
      </button>
      <button class="hamburger" id="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- mobile dropdown menu -->
  <div class="mobile-menu" id="mobile-menu">
    <a href="#home">Home</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#certificates">Certificates</a>
    <a href="#contact">Contact</a>
  </div>


  <!-- ======== HERO ======================================== -->
  <section class="hero" id="home">

    <div class="hero-text">
      <div class="open-badge" id="hero-badge">
        <!-- filled by app.js -->
      </div>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-title"    id="hero-title"></p>
      <p class="hero-title" style="font-size:0.9rem; margin-bottom:0.8rem;" id="hero-subtitle"></p>
      <p class="hero-about"    id="hero-about"></p>
      <div class="hero-buttons" id="hero-buttons"></div>
    </div>

    <div class="hero-photo-wrap">
      <img class="hero-photo" id="hero-photo" src="photo.png" alt="Profile photo">
      <div class="hero-stats" id="hero-stats"></div>
    </div>

  </section>


  <!-- ======== SKILLS ====================================== -->
  <section class="section section-alt" id="skills">
    <div class="section-header">
      <span class="section-tag">Tech Stack</span>
      <h2 class="section-title">Skills &amp; Technologies</h2>
      <p class="section-subtitle" id="skills-subtitle"></p>
    </div>
    <div class="skills-grid fade-in" id="skills-grid"></div>
  </section>


  <!-- ======== PROJECTS ==================================== -->
  <section class="section" id="projects">
    <div class="section-header">
      <span class="section-tag">What I've Built</span>
      <h2 class="section-title">My Projects</h2>
      <p class="section-subtitle" id="projects-subtitle"></p>
    </div>
    <div class="projects-grid" id="projects-grid"></div>
  </section>


  <!-- ======== CERTIFICATES ================================ -->
  <section class="section section-alt" id="certificates">
    <div class="section-header">
      <span class="section-tag">Achievements</span>
      <h2 class="section-title">Certificates</h2>
      <p class="section-subtitle" id="certs-subtitle"></p>
    </div>
    <div class="cert-filter-bar" id="cert-filter-bar"></div>
    <div class="certs-grid" id="certs-grid"></div>
  </section>


  <!-- ======== CONTACT ===================================== -->
  <section class="section" id="contact">
    <div class="contact-box">
      <span class="section-tag">Let's Connect</span>
      <h2 class="section-title">Ready to Build<br>Something Together?</h2>
      <p id="contact-sub"></p>
      <div class="contact-links" id="contact-links"></div>
    </div>
  </section>


  <!-- ======== FOOTER ====================================== -->
  <footer>
    <span id="footer-text"></span>
    <span id="footer-right"></span>
  </footer>


  <!-- ======== LIGHTBOX ==================================== -->
  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">✕</button>
    <img src="" alt="Certificate">
    <div class="lightbox-caption"></div>
  </div>


  <!-- ======== SCRIPTS ===================================== -->
  <!-- data.js must come first so app.js can read the arrays -->
  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
